<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario responsive</title>

    <link rel="stylesheet" href="style_5.css">
</head>

<body>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- CONTENEDOR DEL FORMULARIO -->
        <section class="formulario">

            <!-- ENCABEZADO -->
            <header class="formulario__header">
                <h1>Registro de usuario</h1>

                <p>
                    Completa la información solicitada
                    para crear tu cuenta.
                </p>
            </header>

            <!-- FORMULARIO -->
            <form class="formulario__contenido">

                <!-- CAMPO NOMBRE -->
                <div class="campo">
                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <!-- CAMPO CORREO -->
                <div class="campo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- CAMPO TELÉFONO -->
                <div class="campo">
                    <label for="telefono">
                        Teléfono
                    </label>

                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu teléfono">
                </div>

                <!-- CAMPO CIUDAD -->
                <div class="campo">
                    <label for="ciudad">
                        Ciudad
                    </label>

                    <input type="text" id="ciudad" name="ciudad" placeholder="Ingresa tu ciudad">
                </div>

                <!-- CAMPO CONTRASEÑA -->
                <div class="campo">
                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" name="password" placeholder="Ingresa una contraseña" required>
                </div>

                <!-- CAMPO CONFIRMACIÓN -->
                <div class="campo">
                    <label for="confirmacion">
                        Confirmar contraseña
                    </label>

                    <input type="password" id="confirmacion" name="confirmacion" placeholder="Repite tu contraseña"
                        required>
                </div>

                <!-- CAMPO COMENTARIOS -->
                <div class="campo campo--completo">
                    <label for="comentarios">
                        Comentarios
                    </label>

                    <textarea id="comentarios" name="comentarios" rows="5"
                        placeholder="Escribe algún comentario..."></textarea>
                </div>

                <!-- BOTÓN DE ENVÍO -->
                <button type="submit" class="campo--completo">
                    Crear cuenta
                </button>

            </form>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        © 2026 Gabriel Salazar - 224034025
    </footer>

</body>

</html>
