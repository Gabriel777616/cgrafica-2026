<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración general del documento -->
    <meta charset="UTF-8">

    <!-- Configuración para diseño responsive -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Hoja de estilos principal -->
    <link
        rel="stylesheet"
        href="style_2.css"
    >

    <!-- Información del documento -->
    <title>Formulario de reserva</title>
</head>

<body>

    <!-- Contenido principal de la página -->
    <main>

        <!-- Contenedor del formulario -->
        <section class="reserva">

            <!-- Encabezado del formulario -->
            <header class="reserva__header">
                <h1>Realizar una reserva</h1>

                <p>
                    Completa los datos para solicitar tu reserva.
                </p>
            </header>


            <!-- Formulario de reserva -->
            <form>

                <!-- Información de la reserva -->
                <div class="campo">
                    <label for="fecha">Fecha</label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="hora">Hora</label>

                    <input
                        type="time"
                        id="hora"
                        name="hora"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="personas">Número de personas</label>

                    <input
                        type="number"
                        id="personas"
                        name="personas"
                        min="1"
                        max="20"
                        placeholder="Ej. 4"
                        required
                    >
                </div>


                <!-- Información adicional -->
                <div class="campo">
                    <label for="comentarios">Comentarios</label>

                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="5"
                        placeholder="Añade alguna observación..."
                    ></textarea>
                </div>


                <!-- Acción principal del formulario -->
                <button type="submit">
                    Reservar
                </button>

            </form>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        © 2026 Gabriel Salazar - 224034025
    </footer>

</body>

</html>
